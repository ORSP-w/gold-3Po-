name: Windows installer release

on:
  push:
    branches:
      - feat/part-1-liquidity-footprint-workspace
    paths:
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
      - "README.md"
      - "RELEASE-TEST-NOTES.md"
      - "package.json"
      - "server.js"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "market-*.js"
      - "research-client.js"
      - "strategy-engine.js"
      - "backtest-engine.js"
      - "risk-engine.js"
      - "adapters/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for build checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon generation dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run tests
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed." }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Syntax checks failed." }

      - name: Stage application and bundled Node.js runtime
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseVersion = (node -p "require('./package.json').version").Trim()
          $appVersion = "$baseVersion-setup.$env:GITHUB_RUN_NUMBER"
          "version=$appVersion" >> $env:GITHUB_OUTPUT

          $stage = Join-Path $env:GITHUB_WORKSPACE "build\GOLD-3Po"
          $runtime = Join-Path $stage "runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          python installer/generate-assets.py (Join-Path $stage "assets")
          if ($LASTEXITCODE -ne 0) { throw "Installer branding asset generation failed." }

          $files = @(
            "index.html",
            "app.js",
            "styles.css",
            "market-data.js",
            "market-client.js",
            "research-client.js",
            "market-engine.js",
            "strategy-engine.js",
            "backtest-engine.js",
            "risk-engine.js",
            "server.js",
            "package.json",
            ".env.example",
            "README.md",
            "RELEASE-TEST-NOTES.md"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Required application file is missing: $file" }
            Copy-Item -LiteralPath $file -Destination $stage
          }

          Copy-Item -LiteralPath "adapters" -Destination $stage -Recurse
          Copy-Item -LiteralPath "installer\Start-GOLD-3Po.ps1" -Destination $stage
          Copy-Item -LiteralPath "installer\Stop-GOLD-3Po.ps1" -Destination $stage
          Copy-Item -LiteralPath "installer\Launch-GOLD-3Po.vbs" -Destination $stage
          Copy-Item -LiteralPath "installer\Stop-GOLD-3Po.vbs" -Destination $stage

          $nodeVersion = (node -p "process.version").Trim()
          $zipName = "node-$nodeVersion-win-x64.zip"
          $download = Join-Path $env:RUNNER_TEMP $zipName
          $url = "https://nodejs.org/dist/$nodeVersion/$zipName"
          Invoke-WebRequest -Uri $url -OutFile $download
          $extract = Join-Path $env:RUNNER_TEMP "node-runtime"
          Expand-Archive -LiteralPath $download -DestinationPath $extract -Force
          $nodeFolder = Join-Path $extract "node-$nodeVersion-win-x64"
          Copy-Item -LiteralPath (Join-Path $nodeFolder "node.exe") -Destination $runtime
          if (Test-Path (Join-Path $nodeFolder "LICENSE")) {
            Copy-Item -LiteralPath (Join-Path $nodeFolder "LICENSE") -Destination (Join-Path $runtime "NODE-LICENSE.txt")
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          Push-Location installer
          try {
            & $compiler "/DAppVersion=${{ steps.meta.outputs.version }}" "GOLD-3Po.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          } finally {
            Pop-Location
          }

          $installer = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE was not produced." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -Encoding ascii
          @(
            "GOLD-3Po Market Lab Windows installer",
            "Version: ${{ steps.meta.outputs.version }}",
            "Commit: $env:GITHUB_SHA",
            "Node.js runtime: bundled (Windows x64)",
            "Tests: npm test and npm run check passed before packaging",
            "Install mode: per-user; administrator rights are not required"
          ) | Set-Content -LiteralPath "release\BUILD-INFO.txt" -Encoding utf8

      - name: Smoke-test Windows installer and local app startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE is missing for smoke test." }

          $installDir = Join-Path $env:RUNNER_TEMP "GOLD-3Po-smoke"
          $installLog = Join-Path $env:RUNNER_TEMP "GOLD-3Po-installer-smoke.log"
          $startScript = Join-Path $installDir "Start-GOLD-3Po.ps1"
          $stopScript = Join-Path $installDir "Stop-GOLD-3Po.ps1"
          $uninstaller = Join-Path $installDir "unins000.exe"
          $baseUrl = "http://127.0.0.1:8787"
          $installed = $false

          try {
            Write-Host "Launching installer silently: $($installer.Name)"
            & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installDir" "/LOG=$installLog"
            if ($LASTEXITCODE -ne 0) { throw "Installer process returned exit code $LASTEXITCODE. Log: $installLog" }
            $installed = $true

            foreach ($required in @(
              (Join-Path $installDir "runtime\node.exe"),
              (Join-Path $installDir "server.js"),
              $startScript,
              $stopScript,
              (Join-Path $installDir "assets\GOLD-3Po.ico")
            )) {
              if (-not (Test-Path -LiteralPath $required)) { throw "Installed file is missing: $required" }
            }

            Write-Host "Starting installed application using the bundled Node.js runtime..."
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $startScript -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw "Application launcher exited with code $LASTEXITCODE" }

            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "$baseUrl/health" -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.ingestConfigured -eq $true) {
                  $healthy = $true
                  break
                }
              } catch {}
            }
            if (-not $healthy) { throw "Installed application failed the HTTP /health test. Inspect logs in $installDir\logs and installer log $installLog" }

            $page = Invoke-WebRequest -Uri $baseUrl -UseBasicParsing -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "GOLD-3Po|Market Lab") {
              throw "Installed application root page did not return the expected HTML."
            }

            Write-Host "PASS: installer launches, files install, bundled Node.js starts, and HTTP health/root checks pass."
          } finally {
            if (Test-Path -LiteralPath $stopScript) {
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $stopScript
            }
            if (Test-Path -LiteralPath $uninstaller) {
              & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-3Po-Windows-Installer-${{ steps.meta.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: GOLD-3Po Market Lab v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
